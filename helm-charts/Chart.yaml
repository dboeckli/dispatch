apiVersion: v2
name: @project.artifactId@-chart
description: A Helm chart for Spring 6 Project
type: application
version: @helm.chart.version@
appVersion: @helm.chart.version@

dependencies:
  - name: dispatch-kafka-chart
    alias: kafka
    version: @helm.chart.version@
    repository: file://charts/kafka
    condition: kafka.enabled

  - name: dispatch-wiremock-chart
    alias: wiremock
    version: @helm.chart.version@
    repository: file://charts/wiremock
    condition: wiremock.enabled